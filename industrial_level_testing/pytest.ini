[pytest]
testpaths = .
python_files = test_*.py
markers =
    smoke: critical checks to verify basic system health
    regression: broader functional regression tests
    integration: tests involving multiple system components
    performance: performance-related tests

# Minimum pytest version required for the project, Ensures compatibility across local environments and CI/CD pipelines
minversion = 9.0.2

# Directory where pytest searches for test files. Restricts discovery only to the tests folder
testpaths = tests

# Test file naming convention. e.g, test_login.py test_operator_crud.py
python_files = test_*.py

# Naming convention for test classes, e.g., class TestLogin:
python_classes = Test*

# Naming convention for test methods/functions. Example: def test_create_operator():
python_functions = test_*

# Custom markers used to organize test execution
# Critical business functionality
# Fast verification after deployment
# Complete regression suite
# Tests covering interactions between components
# Tests that take longer execution time
# End-to-end user journeys
# UI related tests
# API related tests
markers =
    smoke: Smoke tests
    sanity: Sanity tests
    regression: Regression tests
    integration: Integration tests
    slow: Long-running tests
    e2e: End-to-end tests
    ui: User interface tests
    api: API tests

# ----------------------------- Logging Configuration -----------------------------
# Display logs in terminal while tests execute
log_cli = true

# Log level, DEBUG < INFO < WARNING < ERROR
log_cli_level = INFO

# Log message format. Example: 2026-07-03 13:15:01 [INFO] Login successful
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# Timestamp format
log_cli_date_format = %Y-%m-%d %H:%M:%S


# ----------------------------- Default pytest execution options -----------------------------
# Show summary for skipped, failed and errored tests
# Verbose output. Displays full test names instead of dots
# Disable stdout capture. Allows print() statements to be shown
# Do a parallel executions
# Ensures only registered markers are used. Prevents accidental typos
# Generate HTML report after execution
# Embed CSS/JS into a single report file. Makes report portable and easy to share
    # Show slowest tests
addopts =
    -ra
    -v
    -s
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --durations=10


